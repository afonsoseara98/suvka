name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx next build
        env:
          OPENAI_API_KEY: ci-placeholder-key
          # O build recusa-se a correr sem isto (ver next.config.ts): o metadataBase fica
          # escrito no <link rel="canonical"> das páginas estáticas, e um build sem endereço
          # gravava lá localhost. A CI não serve ninguém, portanto o valor não interessa -
          # mas tem de ser declarado, e é de propósito que não é o domínio real: um artefacto
          # da CI que fosse por engano para produção tem de se denunciar em vez de passar.
          APP_URL: https://ci.invalid
